name: Apply UX audit fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('lib/audit.ts'); s=p.read_text()
          s=s.replace('export type Evidence = { section: string; element: string; detail: string; crop?: string };', 'export type Evidence = { section: string; element: string; detail: string; crop?: string; models?: string[]; sourceModel?: string; sourceEvidenceIndex?: number };')
          s=s.replace('export type Finding = { id: string; severity: Severity; category: string; title: string; description: string; recommendation: string; screenrootTasks: string[]; devTasks: string[]; uxPerspective: { law: string; definition: string; assessment: string }; evidence: Evidence[] };', 'export type Finding = { id: string; severity: Severity; category: string; title: string; description: string; recommendation: string; screenrootTasks: string[]; devTasks: string[]; uxPerspective: { law: string; definition: string; assessment: string }; evidence: Evidence[]; models?: string[]; qualityModel?: string };')
          s=s.replace('export type AuditPage = { url: string; title: string; screenshot: string; screenshotWidth: number; screenshotHeight: number; findings: Finding[] };', 'export type ModelRun = { model: string; provider: "OpenRouter" | "Gemini"; status: "success" | "failed"; findingCount: number; error?: string };\nexport type AuditPage = { url: string; title: string; screenshot: string; screenshotWidth: number; screenshotHeight: number; findings: Finding[]; modelRuns: ModelRun[]; qualityModel: string };')

          old='''    return keepCrop && crop ? { section, element, detail, crop: JSON.stringify(crop) } : { section, element, detail };'''
          new='''    const sourceModel = typeof entry.sourceModel === "string" ? entry.sourceModel : undefined;
          const sourceEvidenceIndex = typeof entry.sourceEvidenceIndex === "number" && Number.isInteger(entry.sourceEvidenceIndex) ? entry.sourceEvidenceIndex : undefined;
          const provenance = sourceModel ? { sourceModel, ...(sourceEvidenceIndex !== undefined ? { sourceEvidenceIndex } : {}) } : {};
          return keepCrop && crop ? { section, element, detail, crop: JSON.stringify(crop), ...provenance } : { section, element, detail, ...provenance };'''
          if old not in s: raise SystemExit('normalize return not found')
          s=s.replace(old,new)

          marker='''function parseFindings(text: string, keepCrop = false): Finding[] {
  const json = extractJsonObject(text) as { findings?: unknown[] } | null;
  if (!json || !Array.isArray(json.findings)) return [];
  return json.findings.map((item, index) => normalizeFinding(item, index, keepCrop)).filter((finding) => finding.evidence.length > 0).slice(0, 8);
}
'''
          add=marker+'''\nfunction withModelProvenance(findings: Finding[], model: string): Finding[] {\n  return findings.map((finding) => ({ ...finding, models: [model], evidence: finding.evidence.map((item) => ({ ...item, models: [model] })) }));\n}\n'''
          if marker not in s: raise SystemExit('parse marker not found')
          s=s.replace(marker,add,1)

          start=s.index('async function runAllVisionModels('); end=s.index('\nasync function qualityRun',start)
          run='''async function runAllVisionModels(apiKey: string | undefined, geminiKey: string | undefined, prompt: string, image: Buffer): Promise<{ candidates: Candidate[]; runs: ModelRun[] }> {
  const openRouterRuns = apiKey ? CONFIGURED_VISION_MODELS.map(async (model) => {
    try { const findings = withModelProvenance(await callOpenRouterModel(apiKey, model, prompt, image), model); return { candidate: findings.length ? { model, findings } : null, run: { model, provider: "OpenRouter" as const, status: findings.length ? "success" as const : "failed" as const, findingCount: findings.length, ...(findings.length ? {} : { error: "empty or unusable analysis" }) } }; }
    catch (error) { return { candidate: null, run: { model, provider: "OpenRouter" as const, status: "failed" as const, findingCount: 0, error: error instanceof Error ? error.message : "request failed" } }; }
  }) : [];
  const geminiRuns = geminiKey ? GEMINI_VISION_MODELS.map(async (model) => {
    const displayModel = `google/${model}`;
    try { const findings = withModelProvenance(await callGeminiVisionModel(geminiKey, model, prompt, image), displayModel); return { candidate: findings.length ? { model: displayModel, findings } : null, run: { model: displayModel, provider: "Gemini" as const, status: findings.length ? "success" as const : "failed" as const, findingCount: findings.length, ...(findings.length ? {} : { error: "empty or unusable analysis" }) } }; }
    catch (error) { return { candidate: null, run: { model: displayModel, provider: "Gemini" as const, status: "failed" as const, findingCount: 0, error: error instanceof Error ? error.message : "request failed" } }; }
  }) : [];
  const results = await Promise.all([...openRouterRuns, ...geminiRuns]);
  return { candidates: results.map(r => r.candidate).filter((r): r is Candidate => Boolean(r)), runs: results.map(r => r.run) };
}
'''
          s=s[:start]+run+s[end:]

          start=s.index('async function qualityRun('); end=s.index('\nfunction transferCandidateCrops',start)
          quality='''function normalizeTitle(value: string): string { return value.toLowerCase().replace(/[^a-z0-9]+/g, " ").replace(/\\b(the|a|an|and|with|for|of|to|in|on|is|are)\\b/g, " ").replace(/\\s+/g, " ").trim(); }
function titleSimilarity(a: string,b: string): number { const aa=new Set(normalizeTitle(a).split(" ").filter(Boolean)),bb=new Set(normalizeTitle(b).split(" ").filter(Boolean)); if(!aa.size||!bb.size)return 0; let n=0; aa.forEach(w=>{if(bb.has(w))n++;}); return n/Math.max(aa.size,bb.size); }
function evidenceSimilarity(a: Evidence,b: Evidence): number { return (a.section.toLowerCase()===b.section.toLowerCase()?0.35:0)+titleSimilarity(a.element,b.element)*0.4+titleSimilarity(a.detail,b.detail)*0.25; }
function attachProvenance(selected: Finding[], candidates: Candidate[], qualityModel: string): Finding[] {
  return selected.map(finding=>{
    const matches=candidates.map(candidate=>({candidate,score:Math.max(...candidate.findings.map(source=>titleSimilarity(finding.title,source.title)),0)})).filter(x=>x.score>=0.35).sort((a,b)=>b.score-a.score);
    const findingModels=[...new Set(matches.map(x=>x.candidate.model))];
    const evidence=finding.evidence.map(item=>{
      const exactCandidate=item.sourceModel?candidates.find(c=>c.model===item.sourceModel):undefined;
      const exactSource=exactCandidate&&item.sourceEvidenceIndex!==undefined?exactCandidate.findings.flatMap(f=>f.evidence)[item.sourceEvidenceIndex]:undefined;
      const evidenceMatches=candidates.flatMap(candidate=>candidate.findings.flatMap(source=>source.evidence.map(sourceEvidence=>({model:candidate.model,sourceEvidence,score:evidenceSimilarity(item,sourceEvidence)+titleSimilarity(finding.title,source.title)*0.35})))).filter(x=>x.score>=0.45).sort((a,b)=>b.score-a.score);
      const supporting=[...new Set(evidenceMatches.slice(0,3).map(x=>x.model))];
      return {...item,models:exactCandidate?[exactCandidate.model]:(supporting.length?supporting:findingModels),crop:exactSource?.crop||item.crop};
    });
    return {...finding,models:findingModels.length?findingModels:["quality selection"],qualityModel,evidence};
  });
}
async function qualityRun(geminiKey: string | undefined, candidates: Candidate[], capture: Capture): Promise<Finding[]> {
  if (!candidates.length) throw new Error("No vision model returned usable UX evidence. Please try the screenshot again or check the AI provider keys.");
  const compact=candidates.map(candidate=>({model:candidate.model,findings:candidate.findings.map(finding=>({id:finding.id,severity:finding.severity,category:finding.category,title:finding.title,description:finding.description,recommendation:finding.recommendation,evidence:finding.evidence.map((e,i)=>({index:i,section:e.section,element:e.element,detail:e.detail,crop:e.crop?JSON.parse(e.crop):undefined}))}))}));
  const judgePrompt=`You are the final AI quality router for a client-facing ScreenRoot UX audit. The screenshot is the source of truth. Select 5–8 distinct redesign opportunities, ideally 6–7, distributed across different page regions. Reject hallucinations, duplicates, vague criticism and claims not visibly supported.

EVIDENCE/CROP RULES:
- Every evidence item must describe the exact visible UI element being discussed.
- Never reuse a crop from another evidence item.
- Candidate evidence has a model name and evidence index. If reusing a candidate crop, return the EXACT sourceModel and sourceEvidenceIndex for that evidence.
- If no candidate crop is trustworthy, return a new normalized 0..1 crop based on your own visual inspection.
- Crop tightly around the exact UI being discussed with a little context; never crop the whole page.

Return JSON only: {"findings":[{"id":"finding-1","severity":"high|medium|low","category":"...","title":"...","description":"...","recommendation":"...","evidence":[{"sourceModel":"...","sourceEvidenceIndex":0,"section":"...","element":"...","detail":"...","crop":{"x":0,"y":0,"width":0,"height":0}}]}]}

MODEL ANALYSES:\n${JSON.stringify(compact)}`;
  if(geminiKey){try{const response=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent",{method:"POST",headers:{"Content-Type":"application/json","X-goog-api-key":geminiKey},body:JSON.stringify({contents:[{role:"user",parts:[{text:judgePrompt},{inline_data:{mime_type:"image/jpeg",data:capture.analysisBuffer.toString("base64")}}]}],generationConfig:{thinkingConfig:{thinkingLevel:"low"},responseMimeType:"application/json",maxOutputTokens:3000,temperature:0.05}}),signal:AbortSignal.timeout(GEMINI_TIMEOUT_MS)});if(response.ok){const payload:any=await response.json();const text=(payload?.candidates?.[0]?.content?.parts??[]).map((part:any)=>typeof part?.text==="string"?part.text:"").join("");const json=extractJsonObject(text) as {findings?:unknown[]}|null;if(json&&Array.isArray(json.findings)){const raw=json.findings.map((item,index)=>normalizeFinding(item,index,true)).filter(f=>f.evidence.length>0).slice(0,8);if(raw.length)return attachProvenance(raw,candidates,"google/gemini-3.5-flash").map((f,index)=>({...f,id:`finding-${index+1}`}));}}}catch(error){console.warn("Gemini quality run failed",error);}}
  const groups=new Map<string,{finding:Finding;models:Set<string>}>(); for(const candidate of candidates)for(const finding of candidate.findings){const key=normalizeTitle(finding.title);const existing=groups.get(key);if(existing)existing.models.add(candidate.model);else groups.set(key,{finding,models:new Set([candidate.model])});}
  return Array.from(groups.values()).sort((a,b)=>b.models.size-a.models.size).slice(0,8).map((entry,index)=>({...entry.finding,id:`finding-${index+1}`,models:[...entry.models],qualityModel:"deterministic consensus",evidence:entry.finding.evidence.map(item=>({...item,models:[...entry.models]}))}));
}
'''
          s=s[:start]+quality+s[end:]
          # The old title-only crop transfer is the source of cross-assigned crops. Remove it.
          start=s.index('function transferCandidateCrops'); end=s.index('\nfunction parseCrop',start); s=s[:start]+s[end:]

          # Distinguish design vs engineering tasks even when Gemini enrichment fails.
          marker='async function enrichWithGemini(apiKey: string | undefined, findings: Finding[]): Promise<Finding[]> {'
          helper='''function distinctTasks(finding: Finding): Finding {\n  const design=finding.screenrootTasks.filter(Boolean).slice(0,3);\n  const set=new Set(design.map(t=>t.trim().toLowerCase()));\n  let dev=finding.devTasks.filter(Boolean).filter(t=>!set.has(t.trim().toLowerCase())).slice(0,3);\n  const section=finding.evidence[0]?.section||finding.category;\n  if(!design.length) design.push(`Rework the ${section.toLowerCase()} hierarchy and interaction model.`);\n  if(!dev.length) dev=[`Implement the revised ${section.toLowerCase()} structure and responsive states.`,`Validate semantic markup, interaction states and keyboard behavior for this component.`];\n  return {...finding,screenrootTasks:design,devTasks:dev};\n}\n\n'''+marker
          s=s.replace(marker,helper)
          s=s.replace('if (!enrichment) return finding;', 'if (!enrichment) return distinctTasks(finding);')
          s=s.replace('''    });
  } catch { return findings; }
}''','''    });
  } catch { return findings.map(distinctTasks); }
}''',1)

          s=s.replace('const candidates = await runAllVisionModels(openRouterKey, geminiKey, prompt, capture.analysisBuffer);','const { candidates, runs } = await runAllVisionModels(openRouterKey, geminiKey, prompt, capture.analysisBuffer);')
          s=s.replace('''const selected = await qualityRun(geminiKey, candidates, capture);
  const withModelCrops = transferCandidateCrops(selected, candidates);''','''const selected = await qualityRun(geminiKey, candidates, capture);''')
          s=s.replace('locateMissingEvidenceCrops(geminiKey, withModelCrops, capture)','locateMissingEvidenceCrops(geminiKey, selected, capture)')
          s=s.replace('findings: enriched };','findings: enriched, modelRuns: runs, qualityModel: "google/gemini-3.5-flash" };')
          p.write_text(s)

          p=Path('app/page.tsx'); s=p.read_text()
          s=s.replace('import type { AuditPage, AuditResult, AuditStage } from "@/lib/audit";', 'import type { AuditPage, AuditResult, AuditStage, ModelRun } from "@/lib/audit";')
          marker='const MAX_UPLOAD_BYTES = 4 * 1024 * 1024;'
          helper='''const MAX_UPLOAD_BYTES = 4 * 1024 * 1024;\n\nfunction modelLabel(model: string) {\n  return model.replace(/^google\\//, "").replace(/:free$/, "").replace(/^minimax\\//, "Minimax ").replace(/^gemini-/, "Gemini ").replace(/-/g, " ").replace(/\\bm3\\b/gi, "M3");\n}\n\nfunction ModelStatus({ run }: { run: ModelRun }) {\n  return <div className={`modelStatus ${run.status}`}><span className="modelDot" aria-hidden="true"/><div className="modelStatusText"><strong>{modelLabel(run.model)}</strong><span>{run.status === "success" ? `${run.findingCount} findings returned` : run.error || "No usable response"}</span></div><b>{run.status === "success" ? "READY" : "FAILED"}</b></div>;\n}\n\nfunction ModelChips({ models }: { models?: string[] }) {\n  if (!models?.length) return null;\n  return <div className="modelChips">{models.map(model => <span className="modelChip" key={model}>{modelLabel(model)}</span>)}</div>;\n}'''
          s=s.replace(marker,helper)
          old='''      <div className="evidenceSection"><div className="sectionHeader"><div><div className="muted">CLIENT-READY UX EVIDENCE</div><h3>What is wrong, where it happens, and why it matters</h3></div><span className="pill">{findings.length} findings · {evidenceCount} evidence items</span></div>'''
          new='''      <section className="modelCoverage card"><div className="coverageHeader"><div><div className="muted">AI MODEL COVERAGE</div><h3>Which models actually contributed</h3><p>{page.modelRuns.filter(run => run.status === "success").length} of {page.modelRuns.length} configured vision models returned usable analyses. Quality check: <strong>{modelLabel(page.qualityModel)}</strong>.</p></div><span className="coverageCount">{page.modelRuns.filter(run => run.status === "success").length}/{page.modelRuns.length}</span></div><div className="modelStatusGrid">{page.modelRuns.map(run => <ModelStatus key={run.model} run={run}/>)}</div></section>\n      <div className="evidenceSection"><div className="sectionHeader"><div><div className="muted">CLIENT-READY UX EVIDENCE</div><h3>What is wrong, where it happens, and why it matters</h3></div><span className="pill">{findings.length} findings · {evidenceCount} evidence items</span></div>'''
          if old not in s: raise SystemExit('page section marker not found')
          s=s.replace(old,new)
          s=s.replace('<h3>{finding.title}</h3></div><div className={`severity', '<h3>{finding.title}</h3><ModelChips models={finding.models} /></div><div className={`severity')
          s=s.replace('<p>{item.detail}</p></div></div>)}</div>', '<p>{item.detail}</p><div className="evidenceModelLine">Evidence analysed by <ModelChips models={item.models} /></div></div></div>)}</div>')
          s=s.replace('</div></article>)}', '<div className="qualityTrace">Quality-checked by <strong>{modelLabel(finding.qualityModel || page.qualityModel)}</strong></div></div></article>)}')
          p.write_text(s)

          p=Path('app/globals.css'); s=p.read_text()
          s=s.replace('body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;', 'body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;')
          s += '''\n.modelCoverage{margin-bottom:32px;padding:22px}.coverageHeader{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.coverageHeader h3{font-size:19px;letter-spacing:-.025em;margin:5px 0 4px}.coverageHeader p{font-size:12px;color:var(--sr-muted);margin:0;line-height:1.5}.coverageCount{font-size:28px;font-weight:800}.modelStatusGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:17px}.modelStatus{display:flex;align-items:center;gap:10px;border:1px solid var(--sr-line);border-radius:9px;padding:11px 12px;background:#faf9f5}.modelStatus.failed{background:#fffafa}.modelDot{width:7px;height:7px;border-radius:50%;background:#bdbcb5;flex:0 0 auto}.modelStatus.success .modelDot{background:#247749}.modelStatus.failed .modelDot{background:#b63b32}.modelStatusText{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}.modelStatusText strong{font-size:12px}.modelStatusText span{font-size:10px;color:var(--sr-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modelStatus>b{font-size:9px;color:#247749}.modelStatus.failed>b{color:#b63b32}.modelChips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.modelChip{display:inline-flex;border:1px solid #d9d7ce;background:#f7f6f1;border-radius:999px;padding:4px 7px;color:#5d5c56;font-size:9px;font-weight:750;line-height:1.1}.evidenceModelLine{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid #e4e3dc;color:#7b7971;font-size:10px}.evidenceModelLine .modelChips{margin:0}.qualityTrace{margin-top:13px;text-align:right;color:#929087;font-size:9px}.qualityTrace strong{color:#66645d}\n'''
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/audit.ts app/page.tsx app/globals.css
          git diff --cached --quiet || git commit -m "Fix evidence mapping model status and typography"
          git push
      - name: Remove patch workflow
        if: always()
        run: |
          git rm -f .github/workflows/apply-ux-audit-fixes.yml || true
          git diff --cached --quiet || git commit -m "Remove temporary patch workflow"
          git push || true
