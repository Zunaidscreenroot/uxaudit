name: Validate UX Audit Cloudflare build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel obsolete builds when a newer commit for the same PR or branch arrives.
concurrency:
  group: uxaudit-cloudflare-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # 1.20.13 fixes the current Next.js 15.5.28 compatibility guard; keep this explicit until the lockfile is refreshed.
      - name: Update OpenNext Cloudflare builder for Next.js 15 compatibility
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@1.20.13
      - name: Type-check server and client code
        run: npx tsc --noEmit
      - name: Build and bundle for Cloudflare Workers
        run: npx opennextjs-cloudflare build
