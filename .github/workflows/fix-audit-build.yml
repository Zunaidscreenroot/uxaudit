name: Sync audit model allowlist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove unavailable models from audit engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/audit.ts')
          s = p.read_text()

          # Keep the production candidate pool identical to the model-health allowlist.
          s = re.sub(
              r'const CONFIGURED_VISION_MODELS = \[[\s\S]*?\] as const;',
              '''const CONFIGURED_VISION_MODELS = [\n  "minimax/minimax-m3:free",\n] as const;''',
              s,
              count=1,
          )
          s = re.sub(
              r'const GEMINI_VISION_MODELS = \[[\s\S]*?\] as const;',
              '''const GEMINI_VISION_MODELS = [\n  "gemini-3.5-flash",\n  "gemini-3.5-flash-lite",\n  "gemini-3.1-flash-lite",\n] as const;''',
              s,
              count=1,
          )
          s = re.sub(r'\nconst MAX_DISCOVERED_OPENROUTER_MODELS = 40;\n', '\n', s, count=1)

          # Discovery is intentionally disabled: it was reintroducing deprecated,
          # unavailable and rate-limited free models after every deployment.
          s = re.sub(
              r'\nasync function discoverFreeMultimodalModels\([\s\S]*?\n}\n\nasync function callOpenRouterModel',
              '\nasync function callOpenRouterModel',
              s,
              count=1,
          )

          s = s.replace('provider: { allow_fallbacks: true, sort: "latency" },', 'provider: { allow_fallbacks: false },')
          s = s.replace('const openRouterModels = apiKey ? await discoverFreeMultimodalModels(apiKey) : [];', 'const openRouterModels = apiKey ? [...CONFIGURED_VISION_MODELS] : [];')

          # Do not use the retired 3.8 model for judge/enrichment/crop location.
          s = s.replace('gemini-3.8-flash', 'gemini-3.5-flash')
          s = s.replace('["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.6-flash", "gemini-3.5-flash"]', '["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.5-flash"]')
          s = s.replace('["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.5-flash", "gemini-3.5-flash"]', '["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.5-flash"]')

          p.write_text(s)
          PY

      - name: Verify no retired model IDs remain
        run: |
          if grep -nE 'gemma-4-31b|inkling|gemma-4-26b|Sourceful|mimo-v2|molmo-2-8b|gemma-3-27b|nemotron-nano-12b|gemma-3-12b|qwen3-vl|gemini-3\.8-flash|gemini-3\.6-flash|discoverFreeMultimodalModels|MAX_DISCOVERED_OPENROUTER_MODELS' lib/audit.ts; then
            echo "Retired model reference remains in lib/audit.ts"
            exit 1
          fi

      - name: Commit synced audit engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/audit.ts
          git diff --cached --quiet && exit 0
          git commit -m "Sync audit engine with working vision models"
          git push
