name: UX audit fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ux-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vision audit resilience
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/audit.ts')
          s = p.read_text()
          s = s.replace('const ANALYSIS_TIMEOUT_MS = 18000;', 'const ANALYSIS_TIMEOUT_MS = 28000;')
          s = s.replace('const GEMINI_TIMEOUT_MS = 18000;', 'const GEMINI_TIMEOUT_MS = 14000;')
          s = s.replace('max_tokens: 1800,', 'max_tokens: 2600,', 1)
          s = s.replace('generationConfig: { thinkingConfig: { thinkingLevel: "low" }, responseMimeType: "application/json", maxOutputTokens: 1800, temperature: 0.1 }', 'generationConfig: { responseMimeType: "application/json", maxOutputTokens: 2800, temperature: 0.1 }', 1)
          old = '''function parseFindings(text: string, keepCrop = false): Finding[] {\n  const json = extractJsonObject(text) as { findings?: unknown[] } | null;\n  if (!json || !Array.isArray(json.findings)) return [];\n  return json.findings.map((item, index) => normalizeFinding(item, index, keepCrop)).filter((finding) => finding.evidence.length > 0).slice(0, 8);\n}'''
          new = '''function parseFindings(text: string, keepCrop = false): Finding[] {\n  const json = extractJsonObject(text) as { findings?: unknown[] } | unknown[] | null;\n  const rawFindings = Array.isArray(json) ? json : json && Array.isArray((json as { findings?: unknown[] }).findings) ? (json as { findings: unknown[] }).findings : [];\n  return rawFindings.map((item, index) => normalizeFinding(item, index, keepCrop)).filter((finding) => finding.evidence.length > 0).slice(0, 8);\n}'''
          if old not in s:
              raise SystemExit('parseFindings target not found')
          s = s.replace(old, new)
          marker = 'async function runAllVisionModels(apiKey: string | undefined, geminiKey: string | undefined, prompt: string, image: Buffer): Promise<Candidate[]> {'
          rescue = '''async function rescueVisionModel(geminiKey: string, model: string, image: Buffer): Promise<Finding[]> {\n  const rescuePrompt = `Audit this supplied desktop website screenshot as a visual UX reviewer. Return 4 to 6 distinct, clearly visible UX problems from different page regions. Do not invent hidden behavior or metrics. Every finding must have exactly one evidence item naming the exact visible section and element, plus one concise detail and one normalized crop box (x, y, width, height, all 0..1) tightly surrounding that exact evidence. Keep each finding short. Return JSON only. Shape: {"findings":[{"id":"finding-1","severity":"high|medium|low","category":"Information hierarchy|Navigation|Visual design|Usability & interaction|Language & tone|User engagement","title":"short issue","description":"visible problem","recommendation":"specific redesign action","evidence":[{"section":"Hero","element":"exact visible UI","detail":"what is visibly wrong","crop":{"x":0.1,"y":0.1,"width":0.4,"height":0.15}}]}]}`;\n  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {\n    method: "POST",\n    headers: { "Content-Type": "application/json", "X-goog-api-key": geminiKey },\n    body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: rescuePrompt }, { inline_data: { mime_type: "image/jpeg", data: image.toString("base64") } }] }], generationConfig: { responseMimeType: "application/json", maxOutputTokens: 2600, temperature: 0.1 } }),\n    signal: AbortSignal.timeout(12000)\n  });\n  if (!response.ok) throw new Error(`HTTP ${response.status}`);\n  const payload: any = await response.json();\n  const text = (payload?.candidates?.[0]?.content?.parts ?? []).map((part: any) => typeof part?.text === "string" ? part.text : "").join("");\n  if (!text) throw new Error("empty response");\n  return parseFindings(text, true);\n}\n\n'''
          if marker not in s:
              raise SystemExit('runAllVisionModels marker not found')
          s = s.replace(marker, rescue + marker, 1)
          old2 = '''  const results = await Promise.all([...openRouterRuns, ...geminiRuns]);\n  return results.filter((result): result is Candidate => Boolean(result && result.findings.length));\n}'''
          new2 = '''  const results = await Promise.all([...openRouterRuns, ...geminiRuns]);\n  const usable = results.filter((result): result is Candidate => Boolean(result && result.findings.length));\n  if (usable.length) return usable;\n\n  // Provider health can pass while a full audit request is temporarily rejected or truncated.\n  // Retry Gemini with a much smaller, evidence-first prompt before failing the whole audit.\n  if (geminiKey) {\n    for (const model of GEMINI_VISION_MODELS) {\n      try {\n        const findings = await rescueVisionModel(geminiKey, model, image);\n        if (findings.length) {\n          console.log(`[VisionRescue] ${model} returned ${findings.length} findings`);\n          return [{ model: `google/${model}`, findings }];\n        }\n      } catch (error) {\n        console.warn(`[VisionRescue] ${model} failed`, error);\n      }\n    }\n  }\n  return [];\n}'''
          if old2 not in s:
              raise SystemExit('runAllVisionModels return target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/audit.ts
          git diff --cached --quiet && exit 0
          git commit -m "[ux-fix] Make vision audit resilient"
          git push
