name: Fix audit build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate Gemini property
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/audit.ts')
          s = p.read_text()
          old = 'media_resolution: "MEDIA_RESOLUTION_MEDIUM", media_resolution: "MEDIA_RESOLUTION_MEDIUM"'
          new = 'media_resolution: "MEDIA_RESOLUTION_MEDIUM"'
          if old not in s:
              raise SystemExit('Expected duplicate Gemini property was not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit build fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/audit.ts
          git commit -m "fix: remove duplicate Gemini media resolution property"
          git push
