name: Deploy UX Audit to Cloudflare

# Run manually after the repository has a CLOUDFLARE_API_TOKEN Actions secret.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uxaudit-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check application
        run: npx tsc --noEmit
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - name: Deploy production Worker
        run: npx opennextjs-cloudflare deploy -- --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cb73bfd260a197b57210ae47f427db06
