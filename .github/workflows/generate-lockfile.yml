name: Generate npm lockfile

on:
  push:
    branches: [main]
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Patch audit runtime limits and capture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/audit.ts')
          s = p.read_text()
          s = s.replace('const GEMINI_MODELS = ["gemini-3.5-flash-lite", "gemini-3.8-flash", "gemini-3.7-flash"] as const;', 'const GEMINI_MODELS = ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite"] as const;')
          s = s.replace('const VERIFY_BROWSERLESS_TIMEOUT_MS = 4000;', 'const VERIFY_BROWSERLESS_TIMEOUT_MS = 3500;')
          s = s.replace('const GEMINI_ANALYSIS_TIMEOUT_MS = 8000;', 'const GEMINI_ANALYSIS_TIMEOUT_MS = 14000;')
          s = s.replace('const GEMINI_VERIFY_TIMEOUT_MS = 4000;', 'const GEMINI_VERIFY_TIMEOUT_MS = 3500;')
          s = s.replace('maxOutputTokens, thinkingConfig: { thinkingLevel: "low" }', 'maxOutputTokens, thinkingConfig: { thinkingLevel: "low" }, media_resolution: "MEDIA_RESOLUTION_MEDIUM"')
          s = s.replace('callGemini(apiKey, model, prompt, buffer, 4500, GEMINI_ANALYSIS_TIMEOUT_MS)', 'callGemini(apiKey, model, prompt, buffer, 3000, GEMINI_ANALYSIS_TIMEOUT_MS)')
          s = s.replace('callGemini(apiKey, model, prompt, verificationScreenshot, 1800, GEMINI_VERIFY_TIMEOUT_MS)', 'callGemini(apiKey, model, prompt, verificationScreenshot, 1200, GEMINI_VERIFY_TIMEOUT_MS)')
          s = s.replace('Identify 3 to 8 meaningful, visually evidenced UX issues.', 'Identify 3 to 6 meaningful, visually evidenced UX issues.')

          marker = 'type GeminiAnalysis = { findings: Finding[]; model: string };'
          helper = r'''

function extractJsonObject(text: string): unknown | null {
  const cleaned = text.replace(/```(?:json)?/gi, "").replace(/```/g, "").trim();
  try { return JSON.parse(cleaned); } catch {}
  const start = cleaned.indexOf("{");
  if (start < 0) return null;
  let depth = 0;
  let inString = false;
  let escaped = false;
  for (let i = start; i < cleaned.length; i++) {
    const ch = cleaned[i];
    if (inString) {
      if (escaped) escaped = false;
      else if (ch === "\\") escaped = true;
      else if (ch === '"') inString = false;
      continue;
    }
    if (ch === '"') { inString = true; continue; }
    if (ch === "{") depth++;
    else if (ch === "}") {
      depth--;
      if (depth === 0) {
        try { return JSON.parse(cleaned.slice(start, i + 1)); } catch { return null; }
      }
    }
  }
  return null;
}
'''
          if 'function extractJsonObject' not in s:
              s = s.replace(marker, marker + helper)

          old_analysis = 'try { json = JSON.parse(text); } catch { lastError = `Gemini ${model} returned invalid JSON.`; continue; }'
          new_analysis = 'json = extractJsonObject(text);\n      if (!json) { lastError = `Gemini ${model} returned invalid JSON.`; continue; }'
          s = s.replace(old_analysis, new_analysis)

          old_verify = 'try { parsed = JSON.parse(text) as typeof parsed; } catch { return findings; }'
          new_verify = 'const recovered = extractJsonObject(text);\n    if (recovered && typeof recovered === "object") parsed = recovered as typeof parsed;'
          s = s.replace(old_verify, new_verify)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- package-lock.json lib/audit.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json lib/audit.ts
          git commit -m "fix: correct Gemini JSON recovery patch"
          git push
