name: Fix mobile marker calibration

on:
  push:
    branches:
      - feature/client-branded-report-export

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/client-branded-report-export
          fetch-depth: 0
      - name: Patch mobile marker calibration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/audit.ts')
          s = path.read_text()
          marker = '''async function createVisualPass(apiKey: string, model: string, capture: Capture): Promise<VisualPass> {'''
          if marker not in s:
              raise SystemExit('createVisualPass marker not found')
          helper = r'''async function calibrateMobileMarkers(apiKey: string, model: string, capture: Capture, visualPass: VisualPass): Promise<VisualPass> {
            const prompt = `You are a spatial verification pass for a mobile-responsive UX audit. The first vision pass already identified the observations below, but its marker coordinates may be imprecise on a tall mobile screenshot. You MUST inspect the supplied ORIGINAL screenshot and correct ONLY the marker coordinates. Do not change clientName, viewMode, pageSummary, observation IDs, sections, elements, issues, or whyItMatters.

The screenshot is the exact original image at ${capture.width}x${capture.height}px. It is a MOBILE responsive interface. Do not infer coordinates from the image's total aspect ratio. Locate each named UI region visually in the actual screenshot.

For every observation, return a marker at the visual centre of the exact UI element that demonstrates the issue. Use coordinates normalized to 0-1000, where x=0 is the left edge, x=1000 is the right edge, y=0 is the top edge and y=1000 is the bottom edge. The coordinate must be on the visible element itself, not an approximate section midpoint and not empty space. Pay special attention to the vertical position on long mobile pages: inspect the full screenshot from top to bottom and map each observation to its actual visible location. Do not reuse the previous marker merely because it is plausible.

Return JSON only: {"markers":[{"id":"obs-1","x":500,"y":120}]}

OBSERVATIONS TO LOCATE:
${JSON.stringify(visualPass.observations)}`;
            const text = await geminiGenerate(apiKey, model, [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: capture.buffer.toString("base64") } }], 3200);
            const parsed = extractJson(text);
            const root = parsed && typeof parsed === "object" ? parsed as Record<string, unknown> : {};
            const markers = Array.isArray(root.markers) ? root.markers : [];
            const byId = new Map<string, MarkerPoint>();
            for (const raw of markers) {
              if (!raw || typeof raw !== "object") continue;
              const item = raw as Record<string, unknown>;
              if (typeof item.id !== "string") continue;
              const x = Number(item.x); const y = Number(item.y);
              if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
              byId.set(item.id, { x: clamp(x / 1000, 0.02, 0.98), y: clamp(y / 1000, 0.02, 0.98) });
            }
            return { ...visualPass, observations: visualPass.observations.map((observation) => ({ ...observation, marker: byId.get(observation.id) ?? observation.marker })) };
          }

          old = '''  const result = normalizeVisualPass(extractJson(text));
  if (!result.observations.length) throw new Error("The image-to-text model returned no usable visual observations.");
  return result;'''
          new = '''  const result = normalizeVisualPass(extractJson(text));
  if (!result.observations.length) throw new Error("The image-to-text model returned no usable visual observations.");
  if (result.viewMode === "mobile") return calibrateMobileMarkers(apiKey, model, capture, result);
  return result;'''
          if old not in s:
              raise SystemExit('createVisualPass return block not found')
          s = s.replace(marker, helper + '\n' + marker, 1)
          s = s.replace(old, new, 1)
          path.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/audit.ts
          git commit -m "Calibrate mobile evidence markers" || exit 0
          git push origin feature/client-branded-report-export
          rm -f .github/workflows/fix-mobile-marker-calibration.yml
          git add -A
          git commit -m "Remove temporary marker calibration workflow"
          git push origin feature/client-branded-report-export
