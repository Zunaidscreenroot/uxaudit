# Next.js configuration for Netlify Git builds and Deploy Previews.
# This branch is a preview migration; it does not publish or change production by itself.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.deploy-preview]
  command = "npm run build"

[context.deploy-preview.environment]
  NODE_VERSION = "24"
